name: Viral Studio Windows video-render smoke
on:
  push:
    branches: [jarvis, fix/qwen-scenario-stability-2026-11, dev/viral-studio-2026-10, dev/modes-video-game-cleanup-2026-10]
    paths:
      - '.github/workflows/viral-studio-smoke.yml'
      - 'viral_studio.py'
      - 'viral_studio_ui.py'
      - 'quick_video_brief.py'
      - 'video_scenario_autonomy.py'
      - 'topic_video_engine.py'
      - 'tests/test_topic_video_engine.py'
      - 'scripts/verify_longform_2hour_e2e.py'
      - 'video_timeline.py'
      - 'video_timeline_ui.py'
      - 'tests/test_longform_autoexport.py'
      - 'tests/test_chat_first_intent.py'
      - 'smart_highlight_selection.py'
      - 'audio_highlight_signal.py'
      - 'semantic_video_selection.py'
      - 'tests/test_semantic_video_selection.py'
      - 'timeline_coverage_audit.py'
      - 'video_frame_audit.py'
      - 'video_audio_audit.py'
      - 'tests/test_timeline_coverage_audit.py'
      - 'tests/test_audio_highlight_signal.py'
      - 'scripts/verify_video_audio_selection.py'
      - 'pro_montage.py'
      - 'local_model_inventory.py'
      - 'model_storage.py'
      - 'text_only_main.py'
      - 'chat_first_intent.py'
      - 'tests/test_scenario_and_model_route.py'
      - 'tests/test_model_inventory.py'
      - 'tests/test_viral*'
      - 'tests/test_audience_pipeline.py'
      - 'tests/test_work_modes.py'
      - 'work_modes.py'
      - 'game_catalog.py'
      - 'tests/test_game_video_modes.py'
      - 'docs/MODES_VIDEO_GAMES_RU.md'
      - 'main.py'
      - 'channel_audience.py'
      - 'creator_experts.py'
      - 'video_forecast.py'
      - 'scripts/prepare_ffmpeg.ps1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: 'x64'
      - name: Install CSV and caption dependencies
        run: python -m pip install pillow numpy scipy
      - name: Verify autonomous scenarios and whole-PC discovery without network
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p 'test_scenario_and_model_route.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Offline scenario tests failed' }
          python -m unittest discover -s tests -p 'test_model_inventory.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Offline model inventory tests failed' }
      - name: Verify one-consent longform chat automation without FFmpeg
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p 'test_longform_autoexport.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Autoexport authorization test failed' }
          python -m unittest discover -s tests -p 'test_chat_first_intent.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Chat router safety test failed' }
      - name: Verify short audio activity algorithm without FFmpeg
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p 'test_audio_highlight_signal.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Audio-driven selection unit test failed' }
      - name: Check full-timeline distributed diagnostics offline
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p 'test_timeline_coverage_audit.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Distributed video audit failed' }
      - name: Verify bounded local Qwen frame comparisons without real model
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p 'test_semantic_video_selection.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Vision frame-comparison safety failed' }
      - name: Obtain exact audited FFmpeg for offline installer
        shell: pwsh
        run: ./scripts/prepare_ffmpeg.ps1
      - name: Verify real Windows FFmpeg works (with x264 and ASS)
        shell: pwsh
        run: |
          & './assets/bin/ffmpeg.exe' -hide_banner -version
          & './assets/bin/ffprobe.exe' -hide_banner -version
          python -m unittest discover -s tests -p 'test_viral*.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Viral Studio test failed' }
          python -m unittest discover -s tests -p 'test_scenario_and_model_route.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Scenario generation test failed' }
          python -m unittest discover -s tests -p 'test_model_inventory.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Viral Studio test failed' }
          python -m unittest discover -s tests -p 'test_audience_pipeline.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Audience-first test failed' }
          python -m unittest discover -s tests -p 'test_work_modes.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Profile mode tests failed' }
          python -m unittest discover -s tests -p 'test_game_video_modes.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Game and video stage tests failed' }
      - name: Topic-only real FFmpeg render (zero input footage)
        shell: pwsh
        timeout-minutes: 6
        run: |
          $env:JARVIS_TEST_REAL_TOPIC_VIDEO = "1"
          python -m unittest discover -s tests -p 'test_topic_video_engine.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Topic-to-MP4 render failed' }
      - name: Real FFmpeg audio-guided highlights without speech models
        shell: pwsh
        timeout-minutes: 5
        run: |
          python scripts/verify_video_audio_selection.py
          if ($LASTEXITCODE -ne 0) { throw 'Audio-guided highlight evidence failed' }
      - name: Real long-form timeline render (synthetic 2h -> 15min)
        timeout-minutes: 18
        shell: pwsh
        run: |
          python scripts/verify_longform_2hour_e2e.py
          if ($LASTEXITCODE -ne 0) { throw 'Real long-form montage benchmark failed' }
      - name: Compile UI and editing modules
        run: python -m py_compile viral_studio.py viral_studio_ui.py channel_audience.py creator_experts.py video_forecast.py main.py work_modes.py game_catalog.py
