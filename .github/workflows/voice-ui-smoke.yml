name: JARVIS NOVA text-only UI smoke (no speech models)
on:
  push:
    branches: [jarvis]
    paths:
      - '**/*.py'
      - '**/*.ps1'
      - '**/*.iss'
      - '*.spec'
      - 'requirements-windows.txt'
      - 'auto_update.py'
      - 'update_preferences.py'
      - 'update_center.py'
      - 'tests/test_update_center.py'
      - 'tests/test_lite_edition.py'
      - 'tests/test_optional_model_downloader.py'
      - 'tests/test_ollama_pull_client.py'
      - 'ollama_pull_client.py'
      - 'optional_model_downloader.py'
      - 'model_storage.py'
      - 'optional_model_downloader.py'
      - '.github/workflows/voice-ui-smoke.yml'
      - '.github/workflows/windows-offline.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  text-ui:
    strategy:
      fail-fast: false
      matrix:
        windows: [windows-2022, windows-2025]
    runs-on: ${{ matrix.windows }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
      - name: Minimal text and image test dependencies (NO microphone or TTS)
        run: python -m pip install numpy pillow
      - name: Compile text-only and developer modules
        run: python -m compileall -q bootstrap.py main.py text_only_main.py text_only_ui.py text_only_overlay.py screenshot_review.py local_chat.py freellm_client.py code_gui.py code_agent.py code_workspace.py code_project_engine.py code_languages.py code_checks.py roblox_world_builder.py roblox_asset_pipeline.py viral_studio.py viral_studio_ui.py filmcraft_bridge.py filmcraft_installer.py
      - name: Three complete text UI, coding and security regression passes
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          for ($pass=1; $pass -le 3; $pass++) {
            Write-Host "TEXT-ONLY WINDOWS $env:RUNNER_OS regression pass $pass/3"
            foreach ($suite in @('test_text_only_mode.py',
                                 'test_text_only_bundle.py',
                                 'test_auto_update.py',
                                 'test_publisher_trust.py',
                                 'test_update_center.py',
                                 'test_lite_edition.py',
                                 'test_optional_model_downloader.py',
                                 'test_ollama_pull_client.py',
                                 'test_nova_ui.py',
                                 'test_nova_window_state.py',
                                 'test_local_chat.py',
                                 'test_screenshot_review.py',
                                 'test_popular_edits.py',
                                 'test_creator_accounts.py',
                                 'test_multitrack_composer.py',
                                 'test_creator_publish.py',
                                 'test_self_development.py',
                                 'test_freellm_client.py',
                                 'test_code_*.py',
                                 'test_universal_code_engine.py',
                                 'test_roblox_world_builder.py',
                                 'test_roblox_asset_pipeline.py',
                                 'test_installer_contract.py',
                                 'test_vision_chat_protocol.py',
                                 'test_overlay_commands.py')) {
              python -m unittest discover -s tests -p $suite -v
              if ($LASTEXITCODE -ne 0) {
                throw "Text UI / coding regression $suite failed in pass $pass"
              }
            }
          }
