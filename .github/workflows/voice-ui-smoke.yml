name: JARVIS NOVA voice and offline chat smoke (no models)
on:
  push:
    branches: [fix/voice-ui-2026-10, dev/voice-stability-2026-10, feat/nova-futuristic-ui-2026-10, feat/nova-hud-telemetry-2026-10, feat/overlay-auto-voice-2026-10, feat/overlay-voice-polish-2026-10, feat/overlay-voice-controls-2026-10, feat/mic-auto-recovery-2026-10, feat/adaptive-whisper-replies-2026-10, feat/natural-voice-2026-10, feat/remove-webcam-2026-10, fix/quiet-russian-voice-2026-10, feat/left-nova-fast-voice-2026-10, fix/russian-asr-quality-2026-10, fix/dark-chrome-fast-replies-2026-10]
    paths:
      - '.github/workflows/voice-ui-smoke.yml'
      - 'voice_engine.py'
      - 'asr_quality.py'
      - 'tests/test_asr_quality.py'
      - 'tests/test_dark_ui_fast_replies.py'
      - 'speech_capture.py'
      - 'tests/test_quiet_voice_capture.py'
      - 'tests/test_fast_voice.py'
      - 'scripts/generate_installer_art.py'
      - 'tests/test_installer_appearance.py'
      - 'installer/JarvisNova.iss'
      - 'whisper_mode.py'
      - 'speaker.py'
      - 'speech_output.py'
      - 'tests/test_natural_voice.py'
      - 'tests/test_shutdown.py'
      - 'tests/test_no_camera.py'
      - 'trimodal_service.py'
      - 'trimodal_pipeline.py'
      - 'requirements-windows.txt'
      - 'jarvis_nova.spec'
      - 'tests/test_whisper_mode.py'
      - 'main.py'
      - 'nova_ui.py'
      - 'nova_overlay.py'
      - 'overlay_commands.py'
      - 'tests/test_overlay_commands.py'
      - 'tests/test_voice_ready.py'
      - 'tests/test_microphone_recovery.py'
      - 'tests/test_microphone_ui_reconnect.py'
      - 'tests/test_nova_overlay.py'
      - 'tests/test_whisper_queue.py'
      - 'tests/test_voice_queue_polish.py'
      - 'tests/test_nova_ui.py'
      - 'tests/test_voice_telemetry.py'
      - 'local_chat.py'
      - 'tests/test_voice_fallback.py'
      - 'tests/test_voice_routing.py'
      - 'tests/test_conversation_followup.py'
      - 'tests/test_local_chat.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  voice-ui:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
      - name: Minimal test dependencies
        run: python -m pip install numpy scipy pillow
      - name: Compile changed modules
        run: python -m py_compile voice_engine.py main.py nova_ui.py nova_overlay.py overlay_commands.py whisper_mode.py speaker.py speech_output.py speech_capture.py asr_quality.py local_chat.py
      - name: Unit tests for voice and offline chat
        run: python -m unittest discover -s tests -p 'test_voice_fallback.py' -v && python -m unittest discover -s tests -p 'test_voice_routing.py' -v && python -m unittest discover -s tests -p 'test_conversation_followup.py' -v && python -m unittest discover -s tests -p 'test_local_chat.py' -v && python -m unittest discover -s tests -p 'test_nova_ui.py' -v && python -m unittest discover -s tests -p 'test_voice_telemetry.py' -v && python -m unittest discover -s tests -p 'test_nova_overlay.py' -v && python -m unittest discover -s tests -p 'test_whisper_queue.py' -v && python -m unittest discover -s tests -p 'test_voice_queue_polish.py' -v && python -m unittest discover -s tests -p 'test_overlay_commands.py' -v && python -m unittest discover -s tests -p 'test_voice_ready.py' -v && python -m unittest discover -s tests -p 'test_microphone_recovery.py' -v && python -m unittest discover -s tests -p 'test_microphone_ui_reconnect.py' -v && python -m unittest discover -s tests -p 'test_whisper_mode.py' -v && python -m unittest discover -s tests -p 'test_natural_voice.py' -v && python -m unittest discover -s tests -p 'test_shutdown.py' -v && python -m unittest discover -s tests -p 'test_trimodal_integration.py' -v && python -m unittest discover -s tests -p 'test_no_camera.py' -v && python -m unittest discover -s tests -p 'test_quiet_voice_capture.py' -v && python -m unittest discover -s tests -p 'test_fast_voice.py' -v && python -m unittest discover -s tests -p 'test_installer_appearance.py' -v && python -m unittest discover -s tests -p 'test_asr_quality.py' -v && python -m unittest discover -s tests -p 'test_dark_ui_fast_replies.py' -v
