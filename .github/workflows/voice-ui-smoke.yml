name: JARVIS NOVA voice and offline chat smoke (no models)
on:
  push:
    branches: [fix/voice-ui-2026-10, dev/voice-stability-2026-10, feat/nova-futuristic-ui-2026-10, feat/nova-hud-telemetry-2026-10, feat/overlay-auto-voice-2026-10, feat/overlay-voice-polish-2026-10, feat/overlay-voice-controls-2026-10, feat/mic-auto-recovery-2026-10, feat/adaptive-whisper-replies-2026-10, feat/natural-voice-2026-10, feat/remove-webcam-2026-10, fix/quiet-russian-voice-2026-10, feat/left-nova-fast-voice-2026-10, fix/russian-asr-quality-2026-10, fix/dark-chrome-fast-replies-2026-10, feat/russian-whisper-small-2026-10, fix/russian-wake-recovery-2026-10, fix/russian-short-phrase-asr-2026-10, fix/russian-lexical-retry-2026-10, feat/studio-online-assets-fast-ci-2026-10, feat/autonomous-video-quality-triple-ci-2026-10, feat/video-narration-quality-triple-ci-2026-10]
    paths:
      - '.github/workflows/voice-ui-smoke.yml'
      - 'agent_core.py'
      - 'online_media.py'
      - 'editing_knowledge.py'
      - 'viral_studio_ui.py'
      - 'tests/test_online_media.py'
      - 'tests/test_editing_knowledge.py'
      - 'tests/test_faster_app_routes.py'
      - 'smart_montage.py'
      - 'tests/test_smart_montage.py'
      - 'tests/test_viral_studio.py'
      - 'smart_montage.py'
      - 'tests/test_autonomous_montage.py'
      - 'video_narration.py'
      - 'tests/test_video_narration.py'
      - 'viral_studio.py'
      - 'voice_engine.py'
      - 'build_models.py'
      - 'verify_models.py'
      - 'tests/test_russian_small.py'
      - 'asr_quality.py'
      - 'tests/test_asr_quality.py'
      - 'tests/test_dark_ui_fast_replies.py'
      - 'speech_capture.py'
      - 'tests/test_quiet_voice_capture.py'
      - 'tests/test_fast_voice.py'
      - 'scripts/generate_installer_art.py'
      - 'tests/test_installer_appearance.py'
      - 'installer/JarvisNova.iss'
      - 'whisper_mode.py'
      - 'speaker.py'
      - 'speech_output.py'
      - 'tests/test_natural_voice.py'
      - 'tests/test_shutdown.py'
      - 'tests/test_no_camera.py'
      - 'trimodal_service.py'
      - 'trimodal_pipeline.py'
      - 'requirements-windows.txt'
      - 'jarvis_nova.spec'
      - 'tests/test_whisper_mode.py'
      - 'main.py'
      - 'nova_ui.py'
      - 'nova_overlay.py'
      - 'overlay_commands.py'
      - 'tests/test_overlay_commands.py'
      - 'tests/test_voice_ready.py'
      - 'tests/test_microphone_recovery.py'
      - 'tests/test_microphone_ui_reconnect.py'
      - 'tests/test_nova_overlay.py'
      - 'tests/test_whisper_queue.py'
      - 'tests/test_voice_queue_polish.py'
      - 'tests/test_nova_ui.py'
      - 'tests/test_voice_telemetry.py'
      - 'local_chat.py'
      - 'tests/test_voice_fallback.py'
      - 'tests/test_voice_routing.py'
      - 'tests/test_conversation_followup.py'
      - 'tests/test_local_chat.py'
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  voice-ui:
    strategy:
      fail-fast: false
      matrix:
        windows: [windows-2022, windows-2025]
    runs-on: ${{ matrix.windows }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
      - name: Minimal test dependencies
        run: python -m pip install numpy scipy pillow
      - name: Compile changed modules
        run: python -m py_compile voice_engine.py main.py nova_ui.py nova_overlay.py overlay_commands.py whisper_mode.py speaker.py speech_output.py speech_capture.py asr_quality.py build_models.py verify_models.py local_chat.py online_media.py editing_knowledge.py agent_core.py viral_studio_ui.py smart_montage.py viral_studio.py video_narration.py
      - name: Three complete regression passes on each Windows version
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          for ($pass=1; $pass -le 3; $pass++) {
            Write-Host "===== WINDOWS regression pass $pass / 3 ====="
            python -m unittest discover -s tests -p 'test_voice_fallback.py' -v
            if ($LASTEXITCODE -ne 0) { throw 'Regression failed in pass '+$pass }
            python -m unittest discover -s tests -p 'test_voice_routing.py' -v
            if ($LASTEXITCODE -ne 0) { throw 'Regression failed in pass '+$pass }
            python -m unittest discover -s tests -p 'test_conversation_followup.py' -v
            if ($LASTEXITCODE -ne 0) { throw 'Regression failed in pass '+$pass }
            python -m unittest discover -s tests -p 'test_local_chat.py' -v
            if ($LASTEXITCODE -ne 0) { throw 'Regression failed in pass '+$pass }
            python -m unittest discover -s tests -p 'test_nova_ui.py' -v
            if ($LASTEXITCODE -ne 0) { throw 'Regression failed in pass '+$pass }
            python -m unittest discover -s tests -p 'test_voice_telemetry.py' -v
            if ($LASTEXITCODE -ne 0) { throw 'Regression failed in pass '+$pass }
            python -m unittest discover -s tests -p 'test_nova_overlay.py' -v
            if ($LASTEXITCODE -ne 0) { throw 'Regression failed in pass '+$pass }
            python -m unittest discover -s tests -p 'test_whisper_queue.py' -v
            if ($LASTEXITCODE -ne 0) { throw 'Regression failed in pass '+$pass }
            python -m unittest discover -s tests -p 'test_voice_queue_polish.py' -v
            if ($LASTEXITCODE -ne 0) { throw 'Regression failed in pass '+$pass }
            python -m unittest discover -s tests -p 'test_overlay_commands.py' -v
            if ($LASTEXITCODE -ne 0) { throw 'Regression failed in pass '+$pass }
            python -m unittest discover -s tests -p 'test_voice_ready.py' -v
            if ($LASTEXITCODE -ne 0) { throw 'Regression failed in pass '+$pass }
            python -m unittest discover -s tests -p 'test_microphone_recovery.py' -v
            if ($LASTEXITCODE -ne 0) { throw 'Regression failed in pass '+$pass }
            python -m unittest discover -s tests -p 'test_microphone_ui_reconnect.py' -v
            if ($LASTEXITCODE -ne 0) { throw 'Regression failed in pass '+$pass }
            python -m unittest discover -s tests -p 'test_whisper_mode.py' -v
            if ($LASTEXITCODE -ne 0) { throw 'Regression failed in pass '+$pass }
            python -m unittest discover -s tests -p 'test_natural_voice.py' -v
            if ($LASTEXITCODE -ne 0) { throw 'Regression failed in pass '+$pass }
            python -m unittest discover -s tests -p 'test_shutdown.py' -v
            if ($LASTEXITCODE -ne 0) { throw 'Regression failed in pass '+$pass }
            python -m unittest discover -s tests -p 'test_trimodal_integration.py' -v
            if ($LASTEXITCODE -ne 0) { throw 'Regression failed in pass '+$pass }
            python -m unittest discover -s tests -p 'test_no_camera.py' -v
            if ($LASTEXITCODE -ne 0) { throw 'Regression failed in pass '+$pass }
            python -m unittest discover -s tests -p 'test_quiet_voice_capture.py' -v
            if ($LASTEXITCODE -ne 0) { throw 'Regression failed in pass '+$pass }
            python -m unittest discover -s tests -p 'test_fast_voice.py' -v
            if ($LASTEXITCODE -ne 0) { throw 'Regression failed in pass '+$pass }
            python -m unittest discover -s tests -p 'test_installer_appearance.py' -v
            if ($LASTEXITCODE -ne 0) { throw 'Regression failed in pass '+$pass }
            python -m unittest discover -s tests -p 'test_asr_quality.py' -v
            if ($LASTEXITCODE -ne 0) { throw 'Regression failed in pass '+$pass }
            python -m unittest discover -s tests -p 'test_dark_ui_fast_replies.py' -v
            if ($LASTEXITCODE -ne 0) { throw 'Regression failed in pass '+$pass }
            python -m unittest discover -s tests -p 'test_russian_small.py' -v
            if ($LASTEXITCODE -ne 0) { throw 'Regression failed in pass '+$pass }
            python -m unittest discover -s tests -p 'test_online_media.py' -v
            if ($LASTEXITCODE -ne 0) { throw 'Regression failed in pass '+$pass }
            python -m unittest discover -s tests -p 'test_editing_knowledge.py' -v
            if ($LASTEXITCODE -ne 0) { throw 'Regression failed in pass '+$pass }
            python -m unittest discover -s tests -p 'test_faster_app_routes.py' -v
            if ($LASTEXITCODE -ne 0) { throw 'Regression failed in pass '+$pass }
            python -m unittest discover -s tests -p 'test_smart_montage.py' -v
            if ($LASTEXITCODE -ne 0) { throw 'Regression failed in pass '+$pass }
            python -m unittest discover -s tests -p 'test_autonomous_montage.py' -v
            if ($LASTEXITCODE -ne 0) { throw 'Regression failed in pass '+$pass }
            python -m unittest discover -s tests -p 'test_video_narration.py' -v
            if ($LASTEXITCODE -ne 0) { throw 'Narration regression failed in pass '+$pass }
            Write-Host "ALL TEST GROUPS PASSED: $pass / 3"
          }
