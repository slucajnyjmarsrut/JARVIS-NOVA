name: JARVIS NOVA voice and offline chat smoke (no models)
on:
  push:
    branches: [fix/voice-ui-2026-10, dev/voice-stability-2026-10, feat/nova-futuristic-ui-2026-10, feat/nova-hud-telemetry-2026-10]
    paths:
      - '.github/workflows/voice-ui-smoke.yml'
      - 'voice_engine.py'
      - 'main.py'
      - 'nova_ui.py'
      - 'tests/test_nova_ui.py'
      - 'tests/test_voice_telemetry.py'
      - 'local_chat.py'
      - 'tests/test_voice_fallback.py'
      - 'tests/test_voice_routing.py'
      - 'tests/test_conversation_followup.py'
      - 'tests/test_local_chat.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  voice-ui:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
      - name: Minimal test dependencies
        run: python -m pip install numpy scipy
      - name: Compile changed modules
        run: python -m py_compile voice_engine.py main.py nova_ui.py local_chat.py
      - name: Unit tests for voice and offline chat
        run: python -m unittest discover -s tests -p 'test_voice_fallback.py' -v && python -m unittest discover -s tests -p 'test_voice_routing.py' -v && python -m unittest discover -s tests -p 'test_conversation_followup.py' -v && python -m unittest discover -s tests -p 'test_local_chat.py' -v && python -m unittest discover -s tests -p 'test_nova_ui.py' -v && python -m unittest discover -s tests -p 'test_voice_telemetry.py' -v
