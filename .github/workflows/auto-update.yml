name: JARVIS NOVA background updates and installer safety
on:
  push:
    branches: [jarvis]
    paths:
      - auto_update.py
      - update_preferences.py
      - update_center.py
      - updater_worker.py
      - updater_launcher.py
      - main.py
      - text_only_main.py
      - text_only_ui.py
      - nova_command_palette.py
      - tests/test_auto_update.py
      - tests/test_update_center.py
      - .github/workflows/auto-update.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  update-safe:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025, ubuntu-latest]
    runs-on: \${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python UI test dependencies (no voice models)
        run: python -m pip install pillow numpy
      - name: Syntax-check updater and its UI
        run: python -m compileall -q auto_update.py update_preferences.py update_center.py updater_worker.py updater_launcher.py text_only_main.py main.py
      - name: Verify stable GitHub release SHA256 and update recovery
        run: python -m unittest discover -s tests -p test_auto_update.py -v
      - name: Verify background update center, choices and idle protection
        run: python -m unittest discover -s tests -p test_update_center.py -v
      - name: Verify installed-app contract
        run: python -m unittest discover -s tests -p test_installer_contract.py -v
