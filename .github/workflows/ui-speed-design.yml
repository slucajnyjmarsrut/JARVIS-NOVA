name: JARVIS dark UI and fast video scenarios
on:
  push:
    branches: [jarvis]
    paths:
      - text_only_main.py
      - nova_command_palette.py
      - viral_studio_ui.py
      - studio_theme.py
      - windows_titlebar.py
      - tests/test_windows_titlebar.py
      - viral_studio.py
      - quick_video_brief.py
      - jarvis_nova.spec
      - tests/test_ui_speed_redesign.py
      - .github/workflows/ui-speed-design.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ui-and-scenarios:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install minimal UI dependencies
        run: python -m pip install pillow numpy
      - name: Compile actual UI and scenario Python
        run: python -m compileall -q text_only_main.py nova_command_palette.py viral_studio_ui.py studio_theme.py viral_studio.py quick_video_brief.py
      - name: Run real fast scenario and Tk GUI interaction tests
        run: python -m unittest discover -s tests -p test_ui_speed_redesign.py -v
      - name: Check video editor, output and AI model regression
        run: python -m unittest discover -s tests -p test_viral_studio.py -v
      - name: Check text-only window and no microphone regression
        run: python -m unittest discover -s tests -p test_text_only_mode.py -v
      - name: Check native Windows titlebar integration
        run: python -m unittest discover -s tests -p test_windows_titlebar.py -v
      - name: Check studio integration
        run: python -m unittest discover -s tests -p test_viral_integration.py -v
