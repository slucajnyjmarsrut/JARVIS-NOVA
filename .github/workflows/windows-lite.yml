  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: jarvis-lite-installer
  cancel-in-progress: true
jobs:
  lite-installer:
    runs-on: windows-2022
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
      - name: Install text-only runtime dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-windows.txt
          if ($LASTEXITCODE -ne 0) { throw 'Dependency installation failed' }
      - name: Verify Lite model storage and downloader contracts
        run: python -m unittest discover -s tests -p test_lite_edition.py -v
      - name: Test Qwen stall detection and safe cancellation
        run: python -m unittest discover -s tests -p test_optional_model_downloader.py -v
      - name: Verify API byte counters, partial downloads and localhost-only network
        run: python -m unittest discover -s tests -p test_ollama_pull_client.py -v
      - name: Verify montage styles and account privacy boundaries
        run: python -m unittest discover -s tests -p test_popular_edits.py -v
      - name: Verify creator signup permissions and allowlisted websites
        run: python -m unittest discover -s tests -p test_creator_accounts.py -v
      - name: Test multitrack validation, audio and source protection
        run: python -m unittest discover -s tests -p test_multitrack_composer.py -v
      - name: Test offline upload drafts and official portals
        run: python -m unittest discover -s tests -p test_creator_publish.py -v
      - name: Test editable clip timeline and project safety
        run: python -m unittest discover -s tests -p test_video_timeline.py -v
      - name: Verify SRT UTF-8 subtitle bounds and safe import
        run: python -m unittest discover -s tests -p test_subtitle_tracks.py -v
      - name: Verify player consent and local MP4-only validation
        run: python -m unittest discover -s tests -p test_video_preview.py -v
      - name: Verify code repair guardrails and real coding window
        run: python -m unittest discover -s tests -p "test_code_*.py" -v
      - name: Source audit of all modules
        run: python scripts/audit_module_health.py
      - name: Run existing text-only application tests
        shell: pwsh
        run: |
          python scripts/run_text_only_tests.py
          if ($LASTEXITCODE -ne 0) { throw 'Text-only tests failed' }
      - name: Download verified portable Ollama ONLY (no 1.9GB weights)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./scripts/prepare_ollama.ps1 -RuntimeOnly
          if (-not $?) { throw 'Portable Ollama preparation failed' }
      - name: Download verified FFmpeg and FFprobe
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./scripts/prepare_ffmpeg.ps1
          if ($LASTEXITCODE -ne 0) { throw 'FFmpeg preparation failed' }
      - name: Render a real popular edit with bundled FFmpeg
        shell: pwsh
        run: |
          $env:PATH = (Resolve-Path 'assets/bin').Path + [IO.Path]::PathSeparator + $env:PATH
          python -m unittest discover -s tests -p test_popular_edits.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Popular-edit FFmpeg output verification failed' }
          python -m unittest discover -s tests -p test_multitrack_composer.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Real multitrack FFmpeg output verification failed' }
          python -m unittest discover -s tests -p test_video_timeline.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Real editable timeline FFmpeg export failed' }
          python -m unittest discover -s tests -p test_subtitle_tracks.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Real SRT subtitle burn failed' }
      - name: Real 2-hour footage to 15-minute montage end-to-end
        timeout-minutes: 18
        shell: pwsh
        run: |
          python scripts/verify_longform_2hour_e2e.py
          if ($LASTEXITCODE -ne 0) { throw 'Long-form 2h-to-15min render failed' }
      - name: Generate original Windows icon and Lite installer artwork
        shell: pwsh
        run: |
          python scripts/generate_icon.py
          if ($LASTEXITCODE -ne 0) { throw 'Icon generation failed' }
          $env:JARVIS_NOVA_EDITION='lite'
          python scripts/generate_installer_art.py
          if ($LASTEXITCODE -ne 0) { throw 'Installer art generation failed' }
          Remove-Item Env:JARVIS_NOVA_EDITION
      - name: Build compact Lite EXE without bundled Qwen
        shell: pwsh
        run: |
          $env:JARVIS_NOVA_EDITION='lite'
          python -m PyInstaller --clean --noconfirm --workpath build/lite --distpath dist/lite jarvis_nova.spec
          if ($LASTEXITCODE -ne 0) { throw 'Lite PyInstaller failed' }
          Remove-Item Env:JARVIS_NOVA_EDITION
      - name: Validate Lite payload and measure actual size
        shell: pwsh
        run: |
          python scripts/verify_installer_payload.py --dir dist/lite/JarvisNova
          if ($LASTEXITCODE -ne 0) { throw 'Lite package has invalid contents' }
          python scripts/verify_text_package_size.py --dir dist/lite/JarvisNova --out dist/lite-installer/LITE_SIZE_REPORT.json
          if ($LASTEXITCODE -ne 0) { throw 'Lite bundle size audit failed' }
      - name: Execute real bundled EXE and FFmpeg video render
        shell: pwsh
        run: |
          $exe=(Resolve-Path 'dist/lite/JarvisNova/JarvisNova.exe').Path
          foreach ($arg in @('--self-test','--video-self-test','--supervisor-self-test')) {
            $result=Start-Process -FilePath $exe -ArgumentList $arg -Wait -PassThru
            if ($result.ExitCode -ne 0) { throw "Lite EXE $arg failed: $($result.ExitCode)" }
          }
      - name: Build trusted updater worker
        shell: pwsh
        run: |
          python -m PyInstaller --onefile --clean --noconfirm --name JarvisNovaUpdater --distpath dist/updater updater_launcher.py
          if ($LASTEXITCODE -ne 0) { throw 'Updater helper build failed' }
      - name: Compile per-user Lite installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup install failed' }
          $iscc='C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (!(Test-Path $iscc)) { throw 'ISCC.exe missing' }
          & $iscc installer/JarvisNovaLite.iss
          if ($LASTEXITCODE -ne 0) { throw 'Lite installer compilation failed' }
          $file=Get-ChildItem dist/lite-installer/*.exe | Select-Object -First 1
          if (!$file) { throw 'Lite installer missing' }
          Write-Host ("LITE INSTALLER SIZE: {0} bytes" -f $file.Length)
          Get-FileHash $file.FullName -Algorithm SHA256 | Format-List
      - name: Install Lite, smoke check without Qwen, uninstall
        shell: pwsh
        run: |
          $setup=(Get-ChildItem dist/lite-installer/*.exe | Select-Object -First 1).FullName
          $installed=Start-Process $setup -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-' -PassThru -Wait
          if ($installed.ExitCode -ne 0) { throw "Lite installer failed: $($installed.ExitCode)" }
          $installDir=Join-Path $env:LOCALAPPDATA 'Programs/JarvisNova'
          $exe=Join-Path $installDir 'JarvisNova.exe'
          if (!(Test-Path $exe)) { throw 'Installed Lite executable not found' }
          # Inno default-selected visible Startup option must register the
          # current-user headless Supervisor without any admin privilege.
          $startup=[Environment]::GetFolderPath('Startup')
          $shortcut=Join-Path $startup 'JARVIS NOVA Supervisor.lnk'
          if (!(Test-Path $shortcut)) { throw 'Headless Supervisor login shortcut missing' }
          $link=(New-Object -ComObject WScript.Shell).CreateShortcut($shortcut)
          if ($link.Arguments -ne '--supervisor-daemon') { throw 'Wrong Supervisor startup arguments' }
          $headless=Start-Process $exe -ArgumentList '--supervisor-self-test' -PassThru -Wait
          if ($headless.ExitCode -ne 0) { throw 'Installed headless Supervisor smoke failed' }
          $test=Start-Process $exe -ArgumentList '--self-test' -PassThru -Wait
          if ($test.ExitCode -ne 0) { throw "Installed Lite self-test failed: $($test.ExitCode)" }
          if (Test-Path (Join-Path $installDir '_internal/assets/models/ollama')) {
            throw 'Lite installer incorrectly bundled model weights'
          }
          $remove=Join-Path $installDir 'unins000.exe'
          if (!(Test-Path $remove)) { throw 'Lite uninstaller missing' }
          $result=Start-Process $remove -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -PassThru -Wait
          if ($result.ExitCode -ne 0) { throw "Lite uninstall failed: $($result.ExitCode)" }
      - name: Upload Lite installer + disk-space report
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-NOVA-0.5.18-LITE-DEV-UNVERIFIED-INSTALLER
          path: |
            dist/lite-installer/*.exe
            dist/lite-installer/LITE_SIZE_REPORT.json
          if-no-files-found: error
          retention-days: 7
