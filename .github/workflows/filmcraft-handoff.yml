name: JARVIS FilmCraft native handoff (Windows)
on:
  push:
    branches: [jarvis]
    paths:
      - filmcraft_bridge.py
      - filmcraft_installer.py
      - tests/test_filmcraft_installer.py
      - viral_studio_ui.py
      - viral_studio.py
      - tests/test_filmcraft_bridge.py
      - scripts/verify_filmcraft_handoff.py
      - .github/workflows/filmcraft-handoff.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  filmcraft-cli:
    runs-on: windows-2022
    timeout-minutes: 25
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check handoff and one-click secure installer (offline tests)
        run: python -m unittest discover -s tests -p "test_filmcraft*.py" -v
      - name: Install FFmpeg for synthetic media fixture
        shell: pwsh
        run: |
          if (!(Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            choco install ffmpeg --yes --no-progress
            "C:\ProgramData\chocolatey\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          }
      - name: Auto-download official FilmCraft portable using JARVIS code
        shell: pwsh
        run: |
          $env:LOCALAPPDATA=(Join-Path $env:RUNNER_TEMP 'JarvisPortableProfile')
          # No admin rights. Installer validates GitHub release, pinned size,
          # SHA256, archive paths and expected native binaries before install.
          $lines=python -c "from filmcraft_installer import install_filmcraft; print(install_filmcraft())"
          if ($LASTEXITCODE -ne 0 -or !$lines) {
            throw 'Automatic FilmCraft installation failed'
          }
          $exe=($lines | Select-Object -Last 1).Trim()
          if (!(Test-Path $exe)) { throw "Installed FilmCraft not found: $exe" }
          if (!(Test-Path (Join-Path (Split-Path $exe) 'filmcraft-cli.exe'))) {
            throw 'FilmCraft CLI missing in auto-installed folder'
          }
          "JARVIS_FILMCRAFT_EXE=$exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Official FilmCraft auto-install OK: $exe"
          $again=python -c "from filmcraft_installer import installed_executable; print(installed_executable())"
          if ($LASTEXITCODE -ne 0 -or !$again -or ($again | Select-Object -Last 1).Trim() -ne $exe) {
            throw 'Cached FilmCraft installation failed verification'
          }
      - name: Import actual MP4 source cuts and reopen native FilmCraft project
        shell: pwsh
        run: |
          python scripts/verify_filmcraft_handoff.py --filmcraft-exe "$env:JARVIS_FILMCRAFT_EXE"
