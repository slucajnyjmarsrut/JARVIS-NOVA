name: JARVIS universal coding and Roblox Studio plans
on:
  push:
    branches: [jarvis]
    paths:
      - code_languages.py
      - code_checks.py
      - code_project_engine.py
      - roblox_world_builder.py
      - code_workspace.py
      - code_agent.py
      - code_autopilot.py
      - code_edits.py
      - code_cli.py
      - code_gui.py
      - coding_intent.py
      - freellm_client.py
      - tests/test_universal_code_engine.py
      - tests/test_roblox_world_builder.py
      - .github/workflows/universal-coding.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coding:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Python syntax
        run: python -m compileall -q code_languages.py code_checks.py code_project_engine.py roblox_world_builder.py code_workspace.py code_autopilot.py code_agent.py code_gui.py code_edits.py coding_intent.py freellm_client.py
      - name: Universal project tests
        run: python -m unittest discover -s tests -p "test_universal_code_engine.py" -v
      - name: Roblox map and model tests
        run: python -m unittest discover -s tests -p "test_roblox_world_builder.py" -v
      - name: Regression: existing Java and Luau flows
        run: python -m unittest discover -s tests -p "test_code_*.py" -v
      - name: Regression: FreeLLM gateway
        run: python -m unittest discover -s tests -p "test_freellm_client.py" -v
