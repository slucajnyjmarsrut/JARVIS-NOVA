name: JARVIS Universal Coding & Roblox 3D

on:
  push:
    branches:
      - jarvis
    paths:
      - code_languages.py
      - code_checks.py
      - code_project_engine.py
      - roblox_world_builder.py
      - roblox_asset_pipeline.py
      - code_workspace.py
      - code_agent.py
      - code_autopilot.py
      - code_edits.py
      - code_gui.py
      - code_quality_review.py
      - code_test_sandbox.py
      - code_test_repair.py
      - tests/test_code_quality_review.py
      - tests/test_code_test_repair.py
      - tests/test_code_gui_review.py
      - tests/test_code_test_sandbox.py
      - coding_intent.py
      - freellm_client.py
      - tests/test_universal_code_engine.py
      - tests/test_roblox_world_builder.py
      - tests/test_roblox_asset_pipeline.py
      - .github/workflows/universal-coding.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Syntax check
        run: python -m compileall -q code_languages.py code_checks.py code_project_engine.py roblox_world_builder.py roblox_asset_pipeline.py code_workspace.py code_autopilot.py code_agent.py code_gui.py code_test_sandbox.py code_quality_review.py code_test_repair.py code_edits.py coding_intent.py freellm_client.py
      - name: Run universal language tests
        run: python -m unittest discover -s tests -p test_universal_code_engine.py -v
      - name: Run Roblox map tests
        run: python -m unittest discover -s tests -p test_roblox_world_builder.py -v
      - name: Validate self-contained glTF geometry and SVG layouts
        run: python -m unittest discover -s tests -p test_roblox_asset_pipeline.py -v
      - name: Run prior coding regression tests
        run: python -m unittest discover -s tests -p 'test_code_*.py' -v
      - name: Run FreeLLM regression tests
        run: python -m unittest discover -s tests -p test_freellm_client.py -v

  windows-tests:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Syntax check
        run: python -m compileall -q code_languages.py code_checks.py code_project_engine.py roblox_world_builder.py roblox_asset_pipeline.py code_workspace.py code_autopilot.py code_agent.py code_gui.py code_edits.py coding_intent.py freellm_client.py
      - name: Run universal language tests
        run: python -m unittest discover -s tests -p test_universal_code_engine.py -v
      - name: Run Roblox map tests
        run: python -m unittest discover -s tests -p test_roblox_world_builder.py -v
      - name: Validate self-contained glTF geometry and SVG layouts
        run: python -m unittest discover -s tests -p test_roblox_asset_pipeline.py -v
      - name: Run prior coding regression tests
        run: python -m unittest discover -s tests -p "test_code_*.py" -v
      - name: Run FreeLLM regression tests
        run: python -m unittest discover -s tests -p test_freellm_client.py -v
