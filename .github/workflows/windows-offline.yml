permissions:
  contents: read
env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: 'utf-8'
concurrency:
  group: jarvis-offline-windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  offline-windows:
    runs-on: windows-2022
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
      - name: Check disk and CPU
        shell: pwsh
        run: |
          if ($env:PROCESSOR_ARCHITECTURE -ne 'AMD64') { throw 'Requires Windows x64' }
          $drive=Get-PSDrive C
          Write-Host "Disk free: $([math]::Round($drive.Free/1GB,2)) GB"
          if ($drive.Free -lt 9000000000) { throw 'Need at least 9 GB of free disk at start' }
      - name: Install CPU-only Torch and application dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          if ($LASTEXITCODE -ne 0) { throw 'Torch installation failed' }
          python -m pip install -r requirements-windows.txt
          if ($LASTEXITCODE -ne 0) { throw 'Windows app dependency installation failed' }
      - name: Gate online-license security, offline documentation, fast local routes
        run: python -m unittest discover -s tests -p 'test_online_media.py' -v && python -m unittest discover -s tests -p 'test_editing_knowledge.py' -v && python -m unittest discover -s tests -p 'test_faster_app_routes.py' -v
      - name: Three complete offline unit suite passes, including HUD and video quality
        shell: pwsh
        timeout-minutes: 45
        run: |
          for ($pass=1; $pass -le 3; $pass++) {
            Write-Host "FULL OFFLINE UNIT SUITE $pass / 3"
            python -m unittest discover -s tests -v
            if ($LASTEXITCODE -ne 0) { throw "Offline tests failed on pass $pass" }
          }
      - name: Obtain and check Vosk, Whisper and Silero before packaging
        timeout-minutes: 40
        run: python build_models.py
      - name: Three real Whisper, Vosk and Silero checkpoint verification passes
        shell: pwsh
        timeout-minutes: 70
        run: |
          for ($pass=1; $pass -le 3; $pass++) {
            Write-Host "REAL OFFLINE MODEL VERIFICATION $pass / 3"
            python verify_models.py
            if ($LASTEXITCODE -ne 0) { throw "Real model check failed pass $pass" }
          }
      - name: Download official portable Ollama and full Qwen Vision weights
        timeout-minutes: 75
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/prepare_ollama.ps1 -Tag "${{ inputs.ollama_release_tag || 'latest' }}"
      - name: Three real Whisper-to-Vision-to-Silero E2E passes (no mocks)
        shell: pwsh
        timeout-minutes: 75
        run: |
          for ($pass=1; $pass -le 3; $pass++) {
            Write-Host "REAL WHISPER-VISION-SILERO E2E $pass / 3"
            python offline_e2e_test.py
            if ($LASTEXITCODE -ne 0) { throw "Actual model inference failed on pass $pass" }
          }
      - name: Generate Windows icon (original image, not an external dependency)
        run: python scripts/generate_icon.py
      - name: Generate original dark NOVA installer wizard graphics
        run: python scripts/generate_installer_art.py
      - name: Include audited FFmpeg + FFprobe in OFFLINE installer for Video Studio
        timeout-minutes: 30
        shell: pwsh
        run: |
          ./scripts/prepare_ffmpeg.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Offline FFmpeg download or SHA256 audit failed' }
          foreach ($name in @('ffmpeg.exe','ffprobe.exe')) {
            if (!(Test-Path (Join-Path 'assets/bin' $name))) { throw "Video module missing $name" }
          }
      - name: Three real FFmpeg montage and audience regression passes on Windows
        timeout-minutes: 45
        shell: pwsh
        run: |
          for ($pass=1; $pass -le 3; $pass++) {
            Write-Host "REAL FFMPEG MONTAGE PASS $pass / 3"
            foreach ($suite in @('test_viral*.py','test_audience_pipeline.py',
                                 'test_game_video_modes.py','test_smart_montage.py',
                                 'test_autonomous_montage.py')) {
              python -m unittest discover -s tests -p $suite -v
              if ($LASTEXITCODE -ne 0) { throw "Video suite $suite failed in pass $pass" }
            }
          }
      - name: Build fully bundled onedir Windows application
        timeout-minutes: 60
        run: python -m PyInstaller --clean --noconfirm jarvis_nova.spec
      - name: Three packaged EXE self-test, video render and actual model E2E passes
        timeout-minutes: 90
        shell: pwsh
        run: |
          for ($pass=1; $pass -le 3; $pass++) {
            Write-Host "PACKAGED EXE + REAL MODELS $pass / 3"
            ./scripts/verify_offline_distribution.ps1
            if (!$?) { throw "Packaged test failed in pass $pass" }
          }
      - name: Verify packaged AMD64 app and all THREE offline model stores with blob digests
        timeout-minutes: 15
        run: python scripts/verify_installer_payload.py --dir dist/JarvisNova
      - name: Install official Inno Setup 6.6+ (dark mode) via Chocolatey
        timeout-minutes: 15
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed' }
      - name: Build ONE actual installer EXE
        shell: pwsh
        timeout-minutes: 45
        run: |
          $compiler='C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (!(Test-Path $compiler)) { throw 'No Inno Setup compiler' }
          # ISCC.exe FileVersion can report 0.0.0.0 on Chocolatey, although
          # Chocolatey installed Inno Setup 6.7.1. Let the actual compiler
          # parse WizardStyle=modern dark and fail if unsupported.
          & $compiler 'installer\JarvisNova.iss'
          if ($LASTEXITCODE -ne 0) { throw 'Installer compilation failed' }
          $setups=@(Get-ChildItem 'dist/installer/*.exe')
          if ($setups.Count -ne 1) { throw 'Expected exactly one installer EXE' }
          Write-Host "Real Windows installer bytes: $($setups[0].Length)"
          Get-FileHash $setups[0].FullName -Algorithm SHA256 | Format-List
      - name: Three real Windows install, model E2E, uninstall and data-retention passes
        shell: pwsh
        timeout-minutes: 120
        run: |
          for ($pass=1; $pass -le 3; $pass++) {
            Write-Host "FULL WINDOWS INSTALLER + UNINSTALL $pass / 3"
            ./scripts/test_installer.ps1
            if (!$?) { throw "Real installation test failed pass $pass" }
          }
      - name: Validate model store (FULL checksums at build-time)
        shell: pwsh
        run: |
          python -c "from pathlib import Path; from bundled_vision_runtime import validate_offline_model_store; validate_offline_model_store(Path('assets'), verify_hashes=True); print('Vision blobs SHA256 verified')"
          if ($LASTEXITCODE -ne 0) { throw 'Vision bundle hash verification failed' }
      - name: Write integrity manifest
        shell: pwsh
        run: |
          python scripts/write_release_manifest.py --root dist/JarvisNova --out dist/installer/FULL_FILE_SHA256_MANIFEST.json
          if ($LASTEXITCODE -ne 0) { throw 'Manifest failed' }
          Get-ChildItem dist/installer/*.exe | Get-FileHash -Algorithm SHA256 | ForEach-Object { "$($_.Hash)  $($_.Path | Split-Path -Leaf)" } | Set-Content dist/installer/SHA256SUMS.txt
      - name: Caveats / tests that still REQUIRE a human on clean Windows
        shell: pwsh
        run: |
          @'
          This CI runs the unit suites, bundled models, FFmpeg montage, packaged executable, and real installation/uninstall verifications THREE times on hosted Windows. Content quality, source relevance, actual Commons availability, screen appearance, real microphone and user-experience tests still require hardware/manual verification.
          CI exercises Tk widgets and HUD callbacks but does NOT prove real microphone, camera, Bluetooth, audio output, a user-visible foreground GUI, fresh installation offline, nor close-window cleanup. Treat this installer as DEV/UNVERIFIED until separate clean Windows hardware acceptance.
          '@ | Add-Content $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: JARVIS-NOVA-0.5.18-AUTONOMOUS-VIDEO-TRIPLE-DEV-UNVERIFIED-INSTALLER
          path: |
            dist/installer/*.exe
            dist/installer/SHA256SUMS.txt
            dist/installer/FULL_FILE_SHA256_MANIFEST.json
            assets/BUNDLE_BUILD_INFO.txt
          retention-days: 7
          if-no-files-found: error
